<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#070a12"/>
    </radialGradient>
    <radialGradient id="sphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="35%" stop-color="#06b6d4"/>
      <stop offset="75%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Orbital Energy Ring -->
  <ellipse cx="256" cy="256" rx="210" ry="85" fill="none" stroke="url(#ring)" stroke-width="12" transform="rotate(-25 256 256)" filter="url(#glow)"/>

  <!-- Main Crystal Orb -->
  <circle cx="256" cy="256" r="140" fill="url(#sphere)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#22d3ee" stroke-width="4"/>

  <!-- Specular highlight -->
  <ellipse cx="205" cy="205" rx="55" ry="32" fill="#ffffff" opacity="0.85" transform="rotate(-35 205 205)"/>
  <ellipse cx="230" cy="185" rx="16" ry="10" fill="#ffffff" opacity="0.95"/>

  <!-- Orbital Satellite Orbs -->
  <circle cx="95" cy="210" r="28" fill="#ec4899" filter="url(#glow)"/>
  <circle cx="410" cy="305" r="32" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="340" cy="120" r="22" fill="#10b981" filter="url(#glow)"/>
</svg>
